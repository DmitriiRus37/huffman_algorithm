[project]
name = "huffman-algorithm"
version = "0.1.0"
description = "Huffman compression and decompression of files"
readme = "README.md"
requires-python = ">=3.14"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "--cov --cov-branch --cov-report=term-missing"
markers = [
    "slow: large-file tests (deselect with -m 'not slow')",
]

[dependency-groups]
dev = ["pytest==9.1.1", "pytest-cov==7.1.0"]

[tool.coverage.run]
source = ["src"]

[tool.coverage.report]
fail_under = 90
show_missing = true
# entry-point guards only start the CLI / the Qt event loop
exclude_also = ['if __name__ == "__main__":']
